<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Emplacement reserve FOUNDER_EXECUTIVE_HORIZONTAL — gabarit de prepublication, aucune photographie</title>
  <desc id="d">Gabarit geometrique sans representation humaine. Il reserve un emplacement de 16:9 pour l'actif FOUNDER_EXECUTIVE_HORIZONTAL (Portrait horizontal avec espace de composition, univers institutionnel). Statut TEMP : hors build public.</desc>
  <defs>
    <pattern id="hatch" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#eef3f7"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#cedcE7" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#hatch)"/>
  <rect x="10" y="10" width="1580" height="880" fill="none" stroke="#0f5f82" stroke-width="6" stroke-dasharray="26 18"/>
  <g fill="none" stroke="#9bb0c2" stroke-width="3">
    <line x1="10" y1="10" x2="1590" y2="890"/>
    <line x1="1590" y1="10" x2="10" y2="890"/>
  </g>
  <rect x="96" y="352" width="1408" height="195" fill="#0f3147"/>
  <text x="800" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" letter-spacing="2">TEMP — DO NOT PUBLISH</text>
  <text x="800" y="474" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#bcd3e2" letter-spacing="1">FOUNDER_EXECUTIVE_HORIZONTAL</text>
  <text x="800" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8fb0c6">16:9 · 1600×900 · univers institutionnel</text>
  <text x="800" y="542" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8fb0c6">Aucune photographie. Aucun visage. Emplacement reserve.</text>
</svg>
