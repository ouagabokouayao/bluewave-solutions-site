<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1100" width="880" height="1100" role="img" aria-labelledby="t d">
  <title id="t">Emplacement reserve FOUNDER_PORTRAIT_VERTICAL — gabarit de prepublication, aucune photographie</title>
  <desc id="d">Gabarit geometrique sans representation humaine. Il reserve un emplacement de 4:5 pour l'actif FOUNDER_PORTRAIT_VERTICAL (Portrait vertical mi-corps, univers institutionnel). Statut TEMP : hors build public.</desc>
  <defs>
    <pattern id="hatch" width="28" height="28" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#eef3f7"/>
      <line x1="0" y1="0" x2="0" y2="28" stroke="#cedcE7" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="880" height="1100" fill="url(#hatch)"/>
  <rect x="10" y="10" width="860" height="1080" fill="none" stroke="#0f5f82" stroke-width="6" stroke-dasharray="26 18"/>
  <g fill="none" stroke="#9bb0c2" stroke-width="3">
    <line x1="10" y1="10" x2="870" y2="1090"/>
    <line x1="870" y1="10" x2="10" y2="1090"/>
  </g>
  <rect x="53" y="454" width="774" height="192" fill="#0f3147"/>
  <text x="440" y="520" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="bold" fill="#ffffff" letter-spacing="2">TEMP — DO NOT PUBLISH</text>
  <text x="440" y="572" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#bcd3e2" letter-spacing="1">FOUNDER_PORTRAIT_VERTICAL</text>
  <text x="440" y="610" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8fb0c6">4:5 · 880×1100 · univers institutionnel</text>
  <text x="440" y="640" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#8fb0c6">Aucune photographie. Aucun visage. Emplacement reserve.</text>
</svg>
