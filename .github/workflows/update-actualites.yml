name: Refresh BlueWave maritime watch

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluewave-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect verified feeds
        run: python quality/scripts/update_actualites.py
      - name: Validate site and data
        run: |
          python -m json.tool data/actualites.json >/dev/null
          python -m json.tool data/actualites-status.json >/dev/null
          python quality/scripts/quality_check.py
          node --check assets/js/main.js
          node --check assets/js/qualifier.js
          node --check assets/js/mediatheque.js
          node --check assets/js/actualites.js
          node --check assets/js/automation.js
      - name: Refresh and verify integrity manifest
        run: |
          python quality/scripts/update_manifest.py
          python quality/scripts/verify_manifest.py
          git diff --check
      - name: Commit refreshed watch only when changed
        run: |
          if git diff --quiet; then
            echo "No news update"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/actualites.json data/actualites-status.json MANIFEST_SHA256.json
          git commit -m "chore(news): refresh BlueWave maritime watch [skip ci]"
          git push origin HEAD:main
