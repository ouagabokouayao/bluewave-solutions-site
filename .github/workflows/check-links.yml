name: BlueWave external links

on:
  schedule:
    - cron: "35 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check and classify external links
        run: python quality/scripts/check_external_links.py
