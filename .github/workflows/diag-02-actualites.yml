name: 02 veille actualites (branche de revue)

# Exécute le collecteur existant (quality/scripts/update_actualites.py) et
# pousse uniquement data/actualites.json et data/actualites-status.json sur
# une branche de revue dédiée. Aucune écriture sur main ni sur une PR.

on:
  push:
    branches: [diag-02-actualites-2026-10-16]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecte des sources vérifiées
        run: python quality/scripts/update_actualites.py
      - name: Validation
        run: |
          python -m json.tool data/actualites.json >/dev/null
          python -m json.tool data/actualites-status.json >/dev/null
          python quality/scripts/quality_check.py
      - name: Pousser les seules données sur la branche de revue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b review-out
          git add data/actualites.json data/actualites-status.json
          git diff --cached --stat
          git commit -m "Veille maritime : collecte du $(date -u +%Y-%m-%d) (revue)" || exit 0
          git push -f origin HEAD:refs/heads/diag-02-actualites-revue-2026-10-16
