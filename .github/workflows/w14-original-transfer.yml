name: W14 original Git bundle transfer

on:
  push:
    branches: [w14-transfer-6a69323-2026-10-15]
    paths: [.github/workflows/w14-original-transfer.yml]

permissions:
  contents: write

concurrency:
  group: w14-original-transfer-6a69323
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'ouagabokouayao/bluewave-solutions-site' && github.ref == 'refs/heads/w14-transfer-6a69323-2026-10-15'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.W14_GIT_TRANSFER_TOKEN || github.token }}
      - name: Import original Git objects to an isolated transport ref
        shell: python
        env:
          BUNDLE_BASE64: 
        run: |
          import base64, hashlib, os, pathlib, subprocess

          EXPECTED = "6a693235ca6c3e965ac729149fc174d704f3caad"
          PARENT = "6333ccbd23ee4043232758c73a5dc433ab4d5379"
          BASE = "abf62c24717472590093b92add1c63982ba4895a"
          MAIN = "89cc6315e9fe59046cdcd5c86dccc52027dd4a79"
          TRANSPORT = "refs/heads/w14-objects-6a69323-2026-10-15"
          FINAL = "refs/heads/site-premium-final-v1-2026-10-14"

          def git(*args):
              result = subprocess.run(["git", *args], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              if result.returncode:
                  print(result.stdout, flush=True)
                  result.check_returncode()
              return result.stdout.strip()

          def remote(ref):
              result = git("ls-remote", "origin", ref)
              return result.split()[0] if result else None

          assert os.environ["GITHUB_REPOSITORY"] == "ouagabokouayao/bluewave-solutions-site"
          assert os.environ["GITHUB_REF"] == "refs/heads/w14-transfer-6a69323-2026-10-15"
          assert remote("refs/heads/main") == MAIN, "main differs from the approved baseline"
          assert remote(FINAL) in (None, EXPECTED), "Final branch already has another SHA"
          payload = base64.b64decode(os.environ["BUNDLE_BASE64"], validate=True)
          assert hashlib.sha256(payload).hexdigest() == "83416009f4b86202d32ded975facd02f66a0a56542eae213bd2c87b09c270c7e"
          bundle = pathlib.Path(os.environ["RUNNER_TEMP"]) / "w14-original.bundle"
          bundle.write_bytes(payload)
          git("fetch", "origin", BASE)
          print(git("bundle", "verify", str(bundle)))
          assert git("bundle", "list-heads", str(bundle)) == EXPECTED + " " + FINAL
          git("fetch", str(bundle), FINAL + ":refs/w14/original-candidate")
          assert git("rev-parse", "refs/w14/original-candidate") == EXPECTED
          assert git("rev-parse", EXPECTED + "^") == PARENT
          assert git("rev-parse", PARENT + "^") == BASE
          assert git("cat-file", "-t", EXPECTED) == "commit"
          existing = remote(TRANSPORT)
          assert existing in (None, EXPECTED), "Transport branch already has another SHA"
          if existing is None:
              # An empty lease only permits creating this technical ref, never replacing it.
              print(git("push", "--porcelain", "--force-with-lease=" + TRANSPORT + ":", "origin", EXPECTED + ":" + TRANSPORT))
          assert remote(TRANSPORT) == EXPECTED
          assert remote("refs/heads/main") == MAIN
          print("ORIGINAL_GIT_TRANSFER_PASS " + EXPECTED)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("Original Git bundle imported without rebuilding commits.\n\n")
              report.write("Candidate: `" + EXPECTED + "`\n\nParent: `" + PARENT + "`\n\n")
              report.write("main unchanged: `" + MAIN + "`\n")
