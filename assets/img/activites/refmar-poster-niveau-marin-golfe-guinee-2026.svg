<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Poster scientifique — niveau marin dans le Golfe de Guinée</title>
  <desc id="desc">Visuel éditorial BlueWave : catégorie Production scientifique, poster sur le niveau marin dans le Golfe de Guinée, Journées REFMAR 2026. Motif schématique de marégramme, sans données chiffrées.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06223A"/>
      <stop offset="0.55" stop-color="#0B5D7A"/>
      <stop offset="1" stop-color="#21B6C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02101D" flood-opacity="0.24"/>
    </filter>
    <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 35 C45 5 90 65 135 35 S225 35 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>

  <g filter="url(#shadow)">
    <rect x="150" y="96" width="1300" height="708" rx="26" fill="#F7F2E8"/>
  </g>

  <rect x="210" y="162" width="470" height="52" rx="26" fill="#06223A"/>
  <text x="445" y="197" fill="#6ED6D1" font-family="Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="2.5" text-anchor="middle">PRODUCTION SCIENTIFIQUE</text>

  <text x="210" y="308" fill="#06223A" font-family="Arial, sans-serif" font-size="64" font-weight="800">Niveau marin dans</text>
  <text x="210" y="382" fill="#06223A" font-family="Arial, sans-serif" font-size="64" font-weight="800">le Golfe de Guinée</text>

  <text x="210" y="452" fill="#0B5D7A" font-family="Arial, sans-serif" font-size="34" font-weight="600">Déficit observationnel et enjeux</text>
  <text x="210" y="498" fill="#0B5D7A" font-family="Arial, sans-serif" font-size="34" font-weight="600">pour les politiques publiques côtières</text>

  <rect x="210" y="546" width="180" height="5" rx="3" fill="#21B6C8"/>

  <text x="210" y="620" fill="#3C5568" font-family="Arial, sans-serif" font-size="32" font-weight="600">Journées REFMAR 2026</text>
  <text x="210" y="666" fill="#3C5568" font-family="Arial, sans-serif" font-size="32" font-weight="600">Poster scientifique</text>

  <g>
    <rect x="900" y="250" width="480" height="300" rx="16" fill="#FFFFFF" stroke="#D9E5EC" stroke-width="3"/>
    <line x1="948" y1="530" x2="1340" y2="530" stroke="#7B8E9C" stroke-width="3"/>
    <line x1="948" y1="282" x2="948" y2="530" stroke="#7B8E9C" stroke-width="3"/>
    <path d="M948 430 C1000 372 1052 488 1104 430" fill="none" stroke="#0B5D7A" stroke-width="5" stroke-linecap="round"/>
    <path d="M1236 430 C1288 372 1340 488 1392 430" fill="none" stroke="#0B5D7A" stroke-width="5" stroke-linecap="round" transform="translate(-52 0)"/>
    <path d="M1104 430 L1184 430" fill="none" stroke="#C4402F" stroke-width="5" stroke-dasharray="12 14" stroke-linecap="round"/>
    <text x="1144" y="400" fill="#C4402F" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">lacune</text>
    <text x="1144" y="576" fill="#7B8E9C" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Marégramme schématique — sans données chiffrées</text>
  </g>

  <text x="210" y="740" fill="#7B8E9C" font-family="Arial, sans-serif" font-size="24" font-weight="600">BlueWave Solutions — production</text>
</svg>
