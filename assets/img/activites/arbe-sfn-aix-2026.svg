    <path d="M1060 660 C1140 636 1280 636 1360 660" fill="none" stroke="#0B5D7A" stroke-width="4" stroke-opacity="0.45"/>
    <path d="M1060 690 C1140 666 1280 666 1360 690" fill="none" stroke="#21B6C8" stroke-width="4" stroke-opacity="0.35"/>
  </g>

  <text x="210" y="748" fill="#7B8E9C" font-family="Arial, sans-serif" font-size="24" font-weight="600">BlueWave Solutions — activité</text>
