  <text x="325" y="213" fill="#6ED6D1" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" text-anchor="middle">ÉVÉNEMENT</text>

  <text x="210" y="308" fill="#06223A" font-family="Arial, sans-serif" font-size="50" font-weight="800">Club Aménagement</text>
  <text x="210" y="380" fill="#06223A" font-family="Arial, sans-serif" font-size="50" font-weight="800">&amp; Biodiversité</text>
  <text x="210" y="452" fill="#06223A" font-family="Arial, sans-serif" font-size="50" font-weight="800">Solutions fondées sur la Nature</text>
  <rect x="210" y="554" width="180" height="5" rx="3" fill="#21B6C8"/>

  <text x="210" y="632" fill="#3C5568" font-family="Arial, sans-serif" font-size="32" font-weight="600">30 juin 2026</text>
  <text x="210" y="682" fill="#3C5568" font-family="Arial, sans-serif" font-size="32" font-weight="600">Aix-en-Provence</text>

  <g opacity="0.9">
    <path d="M1210 620 L1210 400" fill="none" stroke="#0B5D7A" stroke-width="5" stroke-linecap="round"/>
    <path d="M1210 470 C1150 452 1118 404 1120 352 C1176 356 1212 400 1210 470 Z" fill="#21B6C8" fill-opacity="0.35" stroke="#0B5D7A" stroke-width="3"/>
