<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">40 ans après la loi Littoral — espaces publics littoraux</title>
  <desc id="desc">Visuel éditorial BlueWave : catégorie Événement, rencontre du 29 janvier 2026 à Marseille consacrée aux espaces publics littoraux. Motif schématique de trait de côte, sans donnée chiffrée.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06223A"/>
      <stop offset="0.55" stop-color="#0B5D7A"/>
      <stop offset="1" stop-color="#21B6C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02101D" flood-opacity="0.24"/>
    </filter>
    <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 35 C45 5 90 65 135 35 S225 35 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>

  <g filter="url(#shadow)">
    <rect x="150" y="110" width="1300" height="680" rx="26" fill="#F7F2E8"/>
  </g>

  <rect x="210" y="178" width="230" height="52" rx="26" fill="#06223A"/>
  <text x="325" y="213" fill="#6ED6D1" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" text-anchor="middle">ÉVÉNEMENT</text>

  <text x="210" y="308" fill="#06223A" font-family="Arial, sans-serif" font-size="54" font-weight="800">40 ans après</text>
  <text x="210" y="380" fill="#06223A" font-family="Arial, sans-serif" font-size="54" font-weight="800">la loi Littoral</text>
  <text x="210" y="452" fill="#06223A" font-family="Arial, sans-serif" font-size="54" font-weight="800">Espaces publics littoraux</text>
  <rect x="210" y="554" width="180" height="5" rx="3" fill="#21B6C8"/>

  <text x="210" y="632" fill="#3C5568" font-family="Arial, sans-serif" font-size="32" font-weight="600">29 janvier 2026</text>
  <text x="210" y="682" fill="#3C5568" font-family="Arial, sans-serif" font-size="32" font-weight="600">Cour administrative d’appel de Marseille</text>

  <g opacity="0.9">
    <path d="M1020 300 C1110 348 1150 424 1120 500 C1090 576 1160 632 1300 650" fill="none" stroke="#0B5D7A" stroke-width="5" stroke-linecap="round"/>
    <path d="M1060 312 C1150 360 1190 436 1160 512 C1130 588 1200 644 1340 662" fill="none" stroke="#21B6C8" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round"/>
    <circle cx="1120" cy="500" r="9" fill="#21B6C8"/>
    <text x="1180" y="726" fill="#7B8E9C" font-family="Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">Trait de côte et limite d’usage — schéma</text>
  </g>

  <text x="210" y="748" fill="#7B8E9C" font-family="Arial, sans-serif" font-size="24" font-weight="600">BlueWave Solutions — activité</text>
</svg>
