  <text x="325" y="225" fill="#6ED6D1" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3" text-anchor="middle">ÉVÉNEMENT</text>

  <text x="210" y="342" fill="#06223A" font-family="Arial, sans-serif" font-size="66" font-weight="800">Atelier professionnel</text>
