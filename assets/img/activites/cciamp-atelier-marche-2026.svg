<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Atelier professionnel — connaître son marché, vendre mieux</title>
  <desc id="desc">Visuel éditorial BlueWave : catégorie Événement, atelier professionnel du 16 septembre 2026 à Marseille.</desc>
  <defs>
