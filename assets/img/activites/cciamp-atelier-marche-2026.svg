  <text x="210" y="492" fill="#0B5D7A" font-family="Arial, sans-serif" font-size="52" font-weight="700">vendre mieux</text>

  <rect x="210" y="546" width="180" height="5" rx="3" fill="#21B6C8"/>

  <text x="210" y="632" fill="#3C5568" font-family="Arial, sans-serif" font-size="34" font-weight="600">16 septembre 2026</text>
