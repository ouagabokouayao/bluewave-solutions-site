  <g opacity="0.9">
    <circle cx="1230" cy="440" r="168" fill="none" stroke="#21B6C8" stroke-width="3" stroke-opacity="0.45"/>
    <circle cx="1230" cy="440" r="112" fill="none" stroke="#0B5D7A" stroke-width="3" stroke-opacity="0.35"/>
    <circle cx="1230" cy="440" r="56" fill="none" stroke="#06223A" stroke-width="3" stroke-opacity="0.3"/>
