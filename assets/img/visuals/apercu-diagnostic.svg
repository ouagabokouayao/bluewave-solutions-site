<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu d’un diagnostic court</title>
  <desc id="desc">Simulation illustrative d’un diagnostic structuré autour des enjeux, des données et des options.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06223A"/>
      <stop offset="0.55" stop-color="#0B5D7A"/>
      <stop offset="1" stop-color="#21B6C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02101D" flood-opacity="0.24"/>
    </filter>
    <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 35 C45 5 90 65 135 35 S225 35 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="110" width="1360" height="680" rx="36" fill="#F7F2E8"/>
    <rect x="190" y="160" width="230" height="36" rx="18" fill="#D8EFEC"/>
    <text x="305" y="185" text-anchor="middle" fill="#083A5B" font-family="Arial, sans-serif" font-size="15" font-weight="700">SIMULATION ILLUSTRATIVE</text>
    <text x="190" y="252" fill="#06223A" font-family="Arial, sans-serif" font-size="38" font-weight="700">Diagnostic court</text>
    <text x="190" y="298" fill="#355267" font-family="Arial, sans-serif" font-size="23">Vulnérabilités · acteurs · données manquantes · options de décision</text>

    <rect x="190" y="352" width="360" height="320" rx="24" fill="#E8F2F3"/>
    <rect x="620" y="352" width="360" height="320" rx="24" fill="#E8F2F3"/>
    <rect x="1050" y="352" width="360" height="320" rx="24" fill="#E8F2F3"/>

    <text x="235" y="414" fill="#06223A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Enjeux</text>
    <text x="665" y="414" fill="#06223A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Données</text>
    <text x="1095" y="414" fill="#06223A" font-family="Arial, sans-serif" font-size="28" font-weight="700">Options</text>

    <text x="235" y="476" fill="#355267" font-family="Arial, sans-serif" font-size="22">
      <tspan x="235" dy="0">Pressions observées</tspan>
      <tspan x="235" dy="45">Usages et interfaces</tspan>
      <tspan x="235" dy="45">Risques à hiérarchiser</tspan>
      <tspan x="235" dy="45">Acteurs concernés</tspan>
    </text>
    <text x="665" y="476" fill="#355267" font-family="Arial, sans-serif" font-size="22">
      <tspan x="665" dy="0">Sources disponibles</tspan>
      <tspan x="665" dy="45">Lacunes identifiées</tspan>
      <tspan x="665" dy="45">Fiabilité à qualifier</tspan>
      <tspan x="665" dy="45">Points à vérifier</tspan>
    </text>
    <text x="1095" y="476" fill="#355267" font-family="Arial, sans-serif" font-size="22">
      <tspan x="1095" dy="0">Poursuivre</tspan>
      <tspan x="1095" dy="45">Expertiser</tspan>
      <tspan x="1095" dy="45">Concerter</tspan>
      <tspan x="1095" dy="45">Réorienter</tspan>
    </text>

    <text x="800" y="738" text-anchor="middle" fill="#55707F" font-family="Arial, sans-serif" font-size="18">Démonstrateur de structure de diagnostic.</text>
  </g>
</svg>
