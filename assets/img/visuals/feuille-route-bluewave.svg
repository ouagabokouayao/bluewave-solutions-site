<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Feuille de route BlueWave</title><desc id="desc">Visualisation BlueWave V2.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#06223A"/><stop offset="0.55" stop-color="#0B5D7A"/><stop offset="1" stop-color="#21B6C8"/></linearGradient>
  <linearGradient id="sand" x1="0" x2="1"><stop offset="0" stop-color="#E8D7B5"/><stop offset="1" stop-color="#F7F2E8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02101d" flood-opacity="0.25"/></filter>
  <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse"><path d="M0 35 C 45 5, 90 65, 135 35 S 225 35, 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#g)"/><rect width="1600" height="900" fill="url(#waves)"/>

<text x="70" y="90" fill="#F7F2E8" font-family="Arial" font-size="44" font-weight="700">Feuille de route d’aide à la décision</text>
<path d="M180 450 H1420" stroke="#E8D7B5" stroke-width="8" stroke-linecap="round"/>
<g><circle cx="180" cy="450" r="50" fill="#F7F2E8"/><text x="180" y="459" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#06223A">J+0</text><text x="180" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#F7F2E8">Comprendre</text></g>
<g><circle cx="428" cy="450" r="50" fill="#F7F2E8"/><text x="428" y="459" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#06223A">J+10</text><text x="428" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#F7F2E8">Cadrer</text></g>
<g><circle cx="676" cy="450" r="50" fill="#F7F2E8"/><text x="676" y="459" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#06223A">J+25</text><text x="676" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#F7F2E8">Cartographier</text></g>
<g><circle cx="924" cy="450" r="50" fill="#F7F2E8"/><text x="924" y="459" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#06223A">J+40</text><text x="924" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#F7F2E8">Structurer</text></g>
<g><circle cx="1172" cy="450" r="50" fill="#F7F2E8"/><text x="1172" y="459" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#06223A">J+60</text><text x="1172" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#F7F2E8">Décider</text></g>
<g><circle cx="1420" cy="450" r="50" fill="#F7F2E8"/><text x="1420" y="459" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#06223A">J+90</text><text x="1420" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#F7F2E8">Transmettre</text></g>
<rect x="160" y="650" width="1280" height="95" rx="22" fill="#F7F2E8" opacity="0.96"/>
<text x="800" y="708" text-anchor="middle" fill="#06223A" font-size="26" font-family="Arial">Exemple de format — feuille de route modulable selon mission</text>

</svg>
