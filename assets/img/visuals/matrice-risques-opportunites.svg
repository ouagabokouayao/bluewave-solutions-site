<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Matrice risques opportunités</title><desc id="desc">Visualisation BlueWave V2.</desc>
<defs>
  <linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#06223A"/><stop offset="0.55" stop-color="#0B5D7A"/><stop offset="1" stop-color="#21B6C8"/></linearGradient>
  <linearGradient id="sand" x1="0" x2="1"><stop offset="0" stop-color="#E8D7B5"/><stop offset="1" stop-color="#F7F2E8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#02101d" flood-opacity="0.25"/></filter>
  <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse"><path d="M0 35 C 45 5, 90 65, 135 35 S 225 35, 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/></pattern>
</defs>
<rect width="1600" height="900" fill="url(#g)"/><rect width="1600" height="900" fill="url(#waves)"/>

<text x="70" y="90" fill="#F7F2E8" font-family="Arial" font-size="44" font-weight="700">Matrice risques / opportunités</text>
<rect x="110" y="160" width="1380" height="620" rx="36" fill="#F7F2E8"/>
<line x1="800" y1="220" x2="800" y2="730" stroke="#D7E5E8" stroke-width="4"/>
<text x="180" y="245" fill="#06223A" font-size="32" font-family="Arial" font-weight="700">Risques à maîtriser</text>
<text x="870" y="245" fill="#06223A" font-size="32" font-family="Arial" font-weight="700">Opportunités à saisir</text>
<text x="180" y="330" fill="#355267" font-size="26" font-family="Arial">Données insuffisantes</text><text x="870" y="330" fill="#355267" font-size="26" font-family="Arial">Décision mieux cadrée</text>
<text x="180" y="410" fill="#355267" font-size="26" font-family="Arial">Conflits d’usages</text><text x="870" y="410" fill="#355267" font-size="26" font-family="Arial">Dialogue préparé</text>
<text x="180" y="490" fill="#355267" font-size="26" font-family="Arial">Surpromesse technique</text><text x="870" y="490" fill="#355267" font-size="26" font-family="Arial">Appui expert ciblé</text>
<text x="180" y="570" fill="#355267" font-size="26" font-family="Arial">Périmètre flou</text><text x="870" y="570" fill="#355267" font-size="26" font-family="Arial">Feuille de route claire</text>
<text x="180" y="650" fill="#355267" font-size="26" font-family="Arial">Acteurs non alignés</text><text x="870" y="650" fill="#355267" font-size="26" font-family="Arial">Gouvernance renforcée</text>

</svg>
