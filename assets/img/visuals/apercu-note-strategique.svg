<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu d’une note stratégique</title>
  <desc id="desc">Simulation illustrative d’un format de note stratégique BlueWave.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06223A"/>
      <stop offset="0.55" stop-color="#0B5D7A"/>
      <stop offset="1" stop-color="#21B6C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02101D" flood-opacity="0.24"/>
    </filter>
    <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 35 C45 5 90 65 135 35 S225 35 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>

  <g filter="url(#shadow)">
    <rect x="170" y="72" width="520" height="756" rx="20" fill="#F7F2E8"/>
    <rect x="205" y="112" width="450" height="120" rx="14" fill="#06223A"/>
    <text x="240" y="168" fill="#F7F2E8" font-family="Arial, sans-serif" font-size="30" font-weight="700">Note stratégique</text>
    <text x="240" y="204" fill="#E8D7B5" font-family="Arial, sans-serif" font-size="18">Simulation illustrative de format</text>
    <rect x="240" y="282" width="380" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="342" width="340" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="402" width="380" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="462" width="340" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="522" width="380" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="582" width="340" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="642" width="380" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="702" width="340" height="14" rx="7" fill="#D7E5E8"/>
    <rect x="240" y="762" width="210" height="12" rx="6" fill="#6ED6D1"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="150" width="620" height="590" rx="34" fill="#F7F2E8"/>
    <rect x="865" y="195" width="245" height="36" rx="18" fill="#D8EFEC"/>
    <text x="987" y="220" text-anchor="middle" fill="#083A5B" font-family="Arial, sans-serif" font-size="15" font-weight="700">SIMULATION ILLUSTRATIVE</text>
    <text x="865" y="294" fill="#06223A" font-family="Arial, sans-serif" font-size="34" font-weight="700">Ce que montre l’aperçu</text>
    <text x="865" y="365" fill="#355267" font-family="Arial, sans-serif" font-size="23">
      <tspan x="865" dy="0">• Une question reformulée</tspan>
      <tspan x="865" dy="54">• Des faits et des limites explicites</tspan>
      <tspan x="865" dy="54">• Une matrice risques / opportunités</tspan>
      <tspan x="865" dy="54">• Des recommandations prudentes</tspan>
      <tspan x="865" dy="54">• Des prochaines étapes proportionnées</tspan>
    </text>
    <text x="865" y="680" fill="#55707F" font-family="Arial, sans-serif" font-size="18">Exemple de structure — aucun mandat ni résultat réel.</text>
  </g>
</svg>
