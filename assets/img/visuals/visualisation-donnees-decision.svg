<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Des données à la décision</title>
  <desc id="desc">Chaîne de valeur montrant les données, l’analyse, les livrables et la décision.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06223A"/>
      <stop offset="0.55" stop-color="#0B5D7A"/>
      <stop offset="1" stop-color="#21B6C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02101D" flood-opacity="0.24"/>
    </filter>
    <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 35 C45 5 90 65 135 35 S225 35 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>

  <text x="80" y="88" fill="#F7F2E8" font-family="Arial, sans-serif" font-size="46" font-weight="700">Des données à la décision</text>
  <text x="82" y="132" fill="#CFE9EE" font-family="Arial, sans-serif" font-size="23">Ce qui entre dans le travail, ce qui est transformé et ce que le décideur reçoit.</text>

  <path d="M397 455 H448 M772 455 H823 M1147 455 H1198" stroke="#E8D7B5" stroke-width="9" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="72" y="210" width="325" height="500" rx="32" fill="#F7F2E8"/>
    <circle cx="120" cy="260" r="22" fill="#21B6C8"/>
    <text x="120" y="268" text-anchor="middle" fill="#06223A" font-family="Arial, sans-serif" font-size="20" font-weight="700">1</text>
    <text x="112" y="335" fill="#06223A" font-family="Arial, sans-serif" font-size="30" font-weight="700">Données</text>
    <text x="112" y="398" fill="#355267" font-family="Arial, sans-serif" font-size="22">
      <tspan x="112" dy="0">Cartes</tspan>
      <tspan x="112" dy="42">Études</tspan>
      <tspan x="112" dy="42">Photos</tspan>
      <tspan x="112" dy="42">Acteurs</tspan>
      <tspan x="112" dy="42">Contraintes</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="447" y="210" width="325" height="500" rx="32" fill="#F7F2E8"/>
    <circle cx="495" cy="260" r="22" fill="#21B6C8"/>
    <text x="495" y="268" text-anchor="middle" fill="#06223A" font-family="Arial, sans-serif" font-size="20" font-weight="700">2</text>
    <text x="487" y="335" fill="#06223A" font-family="Arial, sans-serif" font-size="30" font-weight="700">Analyse</text>
    <text x="487" y="398" fill="#355267" font-family="Arial, sans-serif" font-size="22">
      <tspan x="487" dy="0">Qualifier</tspan>
      <tspan x="487" dy="42">Croiser</tspan>
      <tspan x="487" dy="42">Cartographier</tspan>
      <tspan x="487" dy="42">Hiérarchiser</tspan>
      <tspan x="487" dy="42">Contrôler</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="822" y="210" width="325" height="500" rx="32" fill="#F7F2E8"/>
    <circle cx="870" cy="260" r="22" fill="#21B6C8"/>
    <text x="870" y="268" text-anchor="middle" fill="#06223A" font-family="Arial, sans-serif" font-size="20" font-weight="700">3</text>
    <text x="862" y="335" fill="#06223A" font-family="Arial, sans-serif" font-size="30" font-weight="700">Livrables</text>
    <text x="862" y="398" fill="#355267" font-family="Arial, sans-serif" font-size="22">
      <tspan x="862" dy="0">Note</tspan>
      <tspan x="862" dy="42">Diagnostic</tspan>
      <tspan x="862" dy="42">Matrice</tspan>
      <tspan x="862" dy="42">Fiche projet</tspan>
      <tspan x="862" dy="42">Feuille de route</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1197" y="210" width="325" height="500" rx="32" fill="#F7F2E8"/>
    <circle cx="1245" cy="260" r="22" fill="#21B6C8"/>
    <text x="1245" y="268" text-anchor="middle" fill="#06223A" font-family="Arial, sans-serif" font-size="20" font-weight="700">4</text>
    <text x="1237" y="335" fill="#06223A" font-family="Arial, sans-serif" font-size="30" font-weight="700">Décision</text>
    <text x="1237" y="398" fill="#355267" font-family="Arial, sans-serif" font-size="22">
      <tspan x="1237" dy="0">Poursuivre</tspan>
      <tspan x="1237" dy="42">Expertiser</tspan>
      <tspan x="1237" dy="42">Concerter</tspan>
      <tspan x="1237" dy="42">Structurer</tspan>
      <tspan x="1237" dy="42">Transmettre</tspan>
    </text>
  </g>

  <text x="800" y="805" text-anchor="middle" fill="#F7F2E8" font-family="Arial, sans-serif" font-size="20">Une chaîne de valeur lisible, sans promesse de résultat ni automatisme décisionnel.</text>
</svg>
