<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Deux espaces prioritaires BlueWave</title>
  <desc id="desc">Comparaison lisible des espaces Méditerranée et France, et Côte d’Ivoire et Afrique de l’Ouest.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06223A"/>
      <stop offset="0.55" stop-color="#0B5D7A"/>
      <stop offset="1" stop-color="#21B6C8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#02101D" flood-opacity="0.24"/>
    </filter>
    <pattern id="waves" width="180" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 35 C45 5 90 65 135 35 S225 35 270 35" fill="none" stroke="#6ED6D1" stroke-opacity="0.12" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/>
  <rect width="1600" height="900" fill="url(#waves)"/>

  <text x="80" y="88" fill="#F7F2E8" font-family="Arial, sans-serif" font-size="46" font-weight="700">Deux espaces prioritaires</text>
  <text x="82" y="132" fill="#CFE9EE" font-family="Arial, sans-serif" font-size="23">Des contextes distincts, une exigence commune : avancer sur des bases vérifiables.</text>

  <path d="M680 455 H920" fill="none" stroke="#E8D7B5" stroke-width="6" stroke-dasharray="14 16" opacity="0.9"/>
  <circle cx="800" cy="455" r="18" fill="#21B6C8"/>

  <g filter="url(#shadow)">
    <rect x="90" y="190" width="590" height="520" rx="34" fill="#F7F2E8"/>
    <text x="140" y="262" fill="#06223A" font-family="Arial, sans-serif" font-size="33" font-weight="700">Méditerranée / France</text>
    <text x="140" y="314" fill="#355267" font-family="Arial, sans-serif" font-size="21">
      <tspan x="140" dy="0">Collectivités · EPCI · ports</tspan>
      <tspan x="140" dy="32">Bureaux d’études · recherche-action</tspan>
    </text>
    <text x="140" y="408" fill="#083A5B" font-family="Arial, sans-serif" font-size="23" font-weight="700">Enjeux</text>
    <text x="140" y="450" fill="#355267" font-family="Arial, sans-serif" font-size="20">
      <tspan x="140" dy="0">Adaptation · solutions fondées sur la nature</tspan>
      <tspan x="140" dy="31">Vulnérabilités · usages</tspan>
      <tspan x="140" dy="31">Gouvernance port-littoral</tspan>
    </text>
    <text x="140" y="570" fill="#083A5B" font-family="Arial, sans-serif" font-size="23" font-weight="700">Formats</text>
    <text x="140" y="612" fill="#355267" font-family="Arial, sans-serif" font-size="20">
      <tspan x="140" dy="0">Atelier · diagnostic · cartographie</tspan>
      <tspan x="140" dy="31">Formation · coopération technique</tspan>
    </text>
  </g>

  <g filter="url(#shadow)">
    <rect x="920" y="190" width="590" height="520" rx="34" fill="#F7F2E8"/>
    <text x="970" y="262" fill="#06223A" font-family="Arial, sans-serif" font-size="33" font-weight="700">Côte d’Ivoire / Afrique de l’Ouest</text>
    <text x="970" y="314" fill="#355267" font-family="Arial, sans-serif" font-size="21">
      <tspan x="970" dy="0">Ports · administrations · institutions</tspan>
      <tspan x="970" dy="32">Programmes · organisations qualifiées</tspan>
    </text>
    <text x="970" y="408" fill="#083A5B" font-family="Arial, sans-serif" font-size="23" font-weight="700">Enjeux</text>
    <text x="970" y="450" fill="#355267" font-family="Arial, sans-serif" font-size="20">
      <tspan x="970" dy="0">Gouvernance maritime · pollution</tspan>
      <tspan x="970" dy="31">Résilience côtière</tspan>
      <tspan x="970" dy="31">Économie bleue et structuration de projets</tspan>
    </text>
    <text x="970" y="570" fill="#083A5B" font-family="Arial, sans-serif" font-size="23" font-weight="700">Formats</text>
    <text x="970" y="612" fill="#355267" font-family="Arial, sans-serif" font-size="20">
      <tspan x="970" dy="0">Note à distance · diagnostic stratégique</tspan>
      <tspan x="970" dy="31">Formation · mission cadrée</tspan>
    </text>
  </g>

  <text x="800" y="790" text-anchor="middle" fill="#F7F2E8" font-family="Arial, sans-serif" font-size="21" font-weight="700">Développement progressif, selon les données et les relais qualifiés.</text>
  <text x="800" y="825" text-anchor="middle" fill="#CFE9EE" font-family="Arial, sans-serif" font-size="18">Méditerranée et golfe de Guinée : deux géographies prioritaires.</text>
</svg>
